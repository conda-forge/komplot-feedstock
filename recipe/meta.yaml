{% set name = "komplot" %}
{% set version = "0.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/komplot-{{ version }}.tar.gz
  sha256: d2913f0cb16ca34a72c63dd7be6e1b4e1a3108c9c25298aa6e5a9835d3362f7a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - wheel
    - setuptools-git-versioning >=2.0,<3
    - matplotlib-base
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base
    - numpy

test:
  imports:
    - komplot
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bwohlberg/komplot
  summary: Simplified matplotlib interface
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bwohlberg
